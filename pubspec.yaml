name: radius
description: "Nearby bounties over a Bluetooth LE mesh. No server, no internet required."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7
  rxdart: ^0.28.0

  # Forms and routing
  formz: ^0.8.0
  go_router: ^16.2.1

  # Local cache and secure storage
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  path_provider: ^2.1.5
  # Pinned to 9.x on purpose. 10.x and later build against compileSdk 37, and
  # the android-37 platform this machine installed reports its api level as
  # "37.0" rather than an integer, so Gradle cannot resolve it and the build
  # fails inside the plugin. Nothing in our code needs the newer API.
  flutter_secure_storage: ^9.2.4

  # Transport: BLE radio, Noise sessions, Nostr fallback
  bluetooth_low_energy: ^6.2.1
  cryptography: ^2.9.0
  nostr: ^2.0.0
  web_socket_channel: ^3.0.3

  intl: any
  # Open Peeps illustrations are SVG. Not on the kit's approved list; there
  # is no approved alternative for vector assets and rasterising 40 drawings
  # for every density would be worse.
  flutter_svg: ^2.0.17
  # One GPS fix when a bounty is posted, turned into a geohash for the Nostr
  # listing. Not on the kit's list; there is no approved alternative for a
  # device sensor, same as the Bluetooth plugin.
  geolocator: ^14.0.2
  collection: ^1.19.0
  meta: ^1.16.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  build_runner: ^2.4.15
  hive_ce_generator: ^1.9.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/peeps/

  # Montserrat, the Contra kit's typeface, in the three weights the kit uses.
  # SIL Open Font License; see assets/fonts/OFL.txt.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800

# App icon. Sources live in assets/icon/ and are the only things to edit;
# every platform size is generated from them with:
#   fvm dart run flutter_launcher_icons
# The adaptive background is the kit's yellow so the Android foreground
# sits on the same ground as the full icon.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFBD12"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
