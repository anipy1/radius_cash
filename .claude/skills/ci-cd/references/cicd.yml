# Copy to .github/workflows/cicd.yml
# Required repository secrets:
#   APP_TOKEN                      — your API's app token (fed to --dart-define)
#   FIREBASE_APP_ID_ANDROID        — Firebase App Distribution app id
#   FIREBASE_SERVICE_CREDENTIALS   — Firebase service-account JSON content
#   TESTERS_GROUPS                 — comma-separated tester group aliases

name: Test, build and deploy

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter doctor -v
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Run tests
        run: flutter test

  android:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --dart-define=app-token=${{ secrets.APP_TOKEN }}
      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          groups: ${{ secrets.TESTERS_GROUPS }}
          file: build/app/outputs/flutter-apk/app-release.apk
